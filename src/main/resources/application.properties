# Spring Boot configuration
spring.application.name=travel-booking-aggregator

# ─── MySQL DataSource ────────────────────────────────────────────────────────
# Credentials are read from environment variables (see .env.example).
# Fallback defaults are provided for local development only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travel_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:travelapp}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── Disable Spring Boot auto-execution of data.sql ──────────────────────────
# Seeding is handled by DataSeeder.java and LocationSeeder.java instead.
spring.sql.init.mode=never

# ─── Demo Seeding ────────────────────────────────────────────────────────────
# Set to true in development to force re-seeding demo journeys
app.seed.force-refresh=false

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ─── Static Resources ────────────────────────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# ─── Jackson ─────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.travelaggregator=INFO
logging.level.org.hibernate.SQL=WARN
